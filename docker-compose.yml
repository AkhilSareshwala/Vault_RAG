version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: vaultrag_postgres
    ports:
      - "5434:5432"  # host 5434 avoids conflict with local PostgreSQL on 5432/5433
    environment:
      POSTGRES_DB: vaultrag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: vaultrag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  default:
    name: vaultrag_network
